<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Wei Li</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <script src="/assets/site-theme.js"></script>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 2rem);
    }

    .not-found {
      width: min(34rem, 100%);
      text-align: center;
      padding: clamp(2rem, 6vw, 3rem) clamp(1.25rem, 5vw, 2.5rem);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .not-found .code {
      margin: 0;
      font-family: var(--header-font);
      font-size: clamp(4.5rem, 16vw, 7rem);
      font-weight: 600;
      line-height: 1;
      color: var(--gold);
    }

    .not-found h1 {
      margin: 0.75rem 0 0.5rem;
      font-size: 1.35rem;
    }

    .not-found p {
      margin: 0 0 2rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .not-found nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    .not-found a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.6rem 1.25rem;
      border: 1px solid var(--line);
      border-radius: var(--control-radius);
      background: var(--surface-strong);
      color: var(--ink);
      font-weight: 600;
    }

    .not-found a:is(:hover, :focus-visible) {
      border-color: var(--gold-line);
      background: var(--gold-soft);
      color: var(--gold);
    }
  </style>
</head>
<body class="error-page">
  <main class="not-found">
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>页面不存在或已被移动。The page you are looking for doesn't exist or has moved.</p>
    <nav aria-label="Helpful links">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a href="/about/">About</a>
      <a href="/ccf/">CCF Online</a>
    </nav>
  </main>
</body>
</html>
